services:
  - type: web
    name: nbk-engage
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless=true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: APP_NAME
        value: NBK Engage
      - key: APP_BASE_URL
        sync: false
      - key: POLL_INTERVAL_SECONDS
        value: "2"
